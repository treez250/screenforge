<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:transparent; overflow:hidden; font-family:-apple-system,'Inter',sans-serif; }

  .bar {
    display:flex; align-items:center; gap:6px;
    background: rgba(8,11,20,0.94);
    border: 1px solid rgba(255,255,255,.14);
    border-radius:999px;
    padding: 0 10px;
    height:48px;
    backdrop-filter: blur(18px);
    -webkit-app-region: drag;
    box-shadow: 0 4px 24px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.07);
  }

  /* recording dot */
  .dot {
    width:8px; height:8px; border-radius:50%;
    flex-shrink:0; transition: background .3s;
  }
  .dot.rec  { background:#f87171; animation: pulse 1.2s infinite; }
  .dot.paused { background:#fbbf24; animation: none; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.2} }

  .time {
    font-family: monospace; font-size:13px; font-weight:700;
    color:#dce8f8; min-width:42px; letter-spacing:.03em;
  }
  .time.paused { color:#fbbf24; }

  /* mic level bar */
  .mic-bar {
    width: 32px; height: 16px;
    display: flex; align-items: flex-end; gap: 1.5px;
    flex-shrink: 0;
  }
  .mic-bar span {
    flex: 1; background: rgba(74,222,128,.5);
    border-radius: 1px; min-height: 2px;
    transition: height .07s;
  }

  .sep { width:1px; height:24px; background:rgba(255,255,255,.1); flex-shrink:0; margin:0 2px; }

  .pill-btn {
    -webkit-app-region: no-drag;
    border:none; font-size:11px; font-weight:700;
    padding:5px 11px; border-radius:999px;
    cursor:pointer; transition:background .15s, color .15s;
    letter-spacing:.01em; display:flex; align-items:center; gap:5px;
  }
  .pause  { background:rgba(255,255,255,.1); color:#dce8f8; }
  .pause:hover { background:rgba(255,255,255,.18); }
  .pause.is-paused { background:rgba(251,191,36,.18); color:#fbbf24; }
  .mark   { background:rgba(99,102,241,.18); color:#a5b4fc; }
  .mark:hover { background:rgba(99,102,241,.3); }
  .shot   { background:rgba(16,185,129,.12); color:#6ee7b7; }
  .shot:hover { background:rgba(16,185,129,.25); }
  .stop   { background:rgba(248,113,113,.18); color:#fca5a5; }
  .stop:hover { background:rgba(248,113,113,.35); }

  .pill-btn svg { width:12px; height:12px; stroke-width:2.5; }

  .cam-chip {
    display:none; align-items:center; gap:4px;
    height:22px; padding:0 8px; border-radius:999px;
    font-size:10px; font-weight:800; letter-spacing:.04em;
    background:rgba(94,234,212,.13); color:#6ee7b7;
    border:1px solid rgba(94,234,212,.22);
    flex-shrink:0;
  }
  .cam-chip svg { width:12px; height:12px; stroke-width:2.4; }
  .audio-chip {
    display:none; align-items:center; gap:4px;
    height:22px; padding:0 8px; border-radius:999px;
    font-size:10px; font-weight:800; letter-spacing:.04em;
    background:rgba(96,165,250,.13); color:#93c5fd;
    border:1px solid rgba(96,165,250,.22);
    flex-shrink:0;
  }
  .audio-chip svg { width:12px; height:12px; stroke-width:2.4; }

  /* keyboard shortcut badge */
  .kbd {
    font-size:8px; font-weight:700; opacity:.5;
    padding:1px 3px; border-radius:2px;
    background:rgba(255,255,255,.08);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body>
<div class="bar">
  <!-- Status dot + timer -->
  <div class="dot rec" id="dot"></div>
  <span class="time" id="t">0:00</span>

  <!-- Mic level meter -->
  <div class="mic-bar" id="micBar">
    <span id="mb1" style="height:3px"></span>
    <span id="mb2" style="height:5px"></span>
    <span id="mb3" style="height:8px"></span>
    <span id="mb4" style="height:5px"></span>
    <span id="mb5" style="height:3px"></span>
  </div>

  <div class="cam-chip" id="camChip">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
    CAM
  </div>
  <div class="audio-chip" id="micChip">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>
    MIC
  </div>
  <div class="audio-chip" id="sysChip">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/><path d="M12 16v4"/></svg>
    SYS
  </div>

  <div class="sep"></div>

  <!-- Pause/Resume -->
  <button class="pill-btn pause" id="pauseBtn" onclick="doPause()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" id="pauseIcon"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
    <span id="pauseLabel">Pause</span>
  </button>

  <!-- Marker -->
  <button class="pill-btn mark" onclick="window.sf && window.sf.floatMarker()" title="Add marker (⌘⇧M)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7" stroke-opacity=".4"/></svg>
    Mark
  </button>

  <!-- Screenshot -->
  <button class="pill-btn shot" onclick="window.sf && window.sf.floatScreenshot()" title="Screenshot (⌘⇧G)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3"/></svg>
    Shot
  </button>

  <div class="sep"></div>

  <!-- Stop -->
  <button class="pill-btn stop" onclick="window.sf && window.sf.floatStop()" title="Stop (⌘⇧S)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
    Stop
  </button>
</div>

<script>
  let startTime = Date.now();
  let paused = false;
  let pausedAt = 0;
  let totalPaused = 0;

  // Timer
  const timerEl = document.getElementById('t');
  const dotEl   = document.getElementById('dot');
  const pauseBtn = document.getElementById('pauseBtn');
  const pauseIcon = document.getElementById('pauseIcon');
  const pauseLabel = document.getElementById('pauseLabel');
  const camChip = document.getElementById('camChip');
  const micChip = document.getElementById('micChip');
  const sysChip = document.getElementById('sysChip');

  function formatTime(ms) {
    const s = Math.floor(ms / 1000);
    const m = Math.floor(s / 60);
    return m + ':' + String(s % 60).padStart(2, '0');
  }

  setInterval(() => {
    if (paused) return;
    const elapsed = Date.now() - startTime - totalPaused;
    timerEl.textContent = formatTime(elapsed);
  }, 200);

  function doPause() {
    window.sf && window.sf.floatPause();
  }

  // Sync pause state from main window
  if (window.sf?.onPauseState) {
    window.sf.onPauseState((isPaused) => {
      paused = isPaused;
      if (isPaused) {
        pausedAt = Date.now();
        dotEl.className = 'dot paused';
        timerEl.className = 'time paused';
        pauseBtn.className = 'pill-btn pause is-paused';
        pauseIcon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3" fill="currentColor"/>';
        pauseLabel.textContent = 'Resume';
      } else {
        if (pausedAt) totalPaused += Date.now() - pausedAt;
        pausedAt = 0;
        dotEl.className = 'dot rec';
        timerEl.className = 'time';
        pauseBtn.className = 'pill-btn pause';
        pauseIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
        pauseLabel.textContent = 'Pause';
      }
    });
  }

  if (window.sf?.onRecordingInfo) {
    window.sf.onRecordingInfo((info) => {
      if (camChip) camChip.style.display = info?.webcam ? 'flex' : 'none';
      if (micChip) micChip.style.display = info?.mic ? 'flex' : 'none';
      if (sysChip) sysChip.style.display = info?.systemAudio ? 'flex' : 'none';
    });
  }

  // Mic level animation (simulated, real mic level would need AudioContext)
  const bars = ['mb1','mb2','mb3','mb4','mb5'];
  const reducedMotion = window.matchMedia?.('(prefers-reduced-motion: reduce)');
  let micAnimRunning = true;
  let micAnimTimer = null;

  function setMicLevels(levels) {
    bars.forEach((id, i) => {
      const el = document.getElementById(id);
      if (el) el.style.height = levels[i] + 'px';
    });
  }

  function animMic() {
    clearTimeout(micAnimTimer);
    if (!micAnimRunning || reducedMotion?.matches) {
      setMicLevels([3, 5, 8, 5, 3]);
      return;
    }
    if (!paused) setMicLevels(bars.map(() => 2 + Math.random() * 13));
    micAnimTimer = setTimeout(animMic, 80);
  }
  reducedMotion?.addEventListener?.('change', animMic);
  animMic();
</script>
</body>
</html>
