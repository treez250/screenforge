<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose recording area</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    user-select: none;
  }
  body {
    color: rgba(255,255,255,.94);
    background: rgba(0, 0, 0, .28);
  }
  #selectionSurface {
    position: fixed;
    inset: 0;
    cursor: crosshair;
  }
  #controls {
    position: fixed;
    top: 22px;
    left: 50%;
    z-index: 4;
    width: min(680px, calc(100vw - 32px));
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 14px 12px 16px;
    border: 1px solid rgba(255,255,255,.17);
    border-radius: 15px;
    background: rgba(28,28,31,.9);
    box-shadow: 0 18px 48px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.06);
    backdrop-filter: blur(28px) saturate(1.2);
    -webkit-backdrop-filter: blur(28px) saturate(1.2);
    cursor: default;
  }
  #copy { min-width: 0; flex: 1; }
  h1 {
    margin: 0 0 3px;
    font-size: 14px;
    line-height: 1.2;
    font-weight: 700;
    letter-spacing: -.01em;
  }
  #instructions {
    margin: 0;
    color: rgba(255,255,255,.72);
    font-size: 11px;
    line-height: 1.45;
  }
  #selectionStatus {
    margin: 4px 0 0;
    color: #8fc5ff;
    font: 650 10px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #actions { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
  button {
    min-height: 34px;
    padding: 7px 13px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 9px;
    color: rgba(255,255,255,.82);
    background: rgba(255,255,255,.07);
    font: 650 12px/1 -apple-system, BlinkMacSystemFont, sans-serif;
    cursor: default;
  }
  button:hover { background: rgba(255,255,255,.12); }
  button:active { transform: scale(.975); }
  button:focus-visible,
  #box:focus-visible {
    outline: 3px solid rgba(64,156,255,.95);
    outline-offset: 3px;
  }
  #confirmBtn {
    color: #fff;
    border-color: rgba(255,255,255,.14);
    background: linear-gradient(180deg, #168cff, #0a84ff);
    box-shadow: inset 0 1px rgba(255,255,255,.2), 0 4px 14px rgba(10,132,255,.2);
  }
  #confirmBtn:hover { background: linear-gradient(180deg, #43a4ff, #369cff); }
  #confirmBtn:disabled { opacity: .45; }
  #box {
    position: fixed;
    z-index: 2;
    display: block;
    border: 2px solid #60a5fa;
    border-radius: 4px;
    background: rgba(96,165,250,.14);
    box-shadow: 0 0 0 9999px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.7) inset;
    cursor: crosshair;
  }
  #size {
    position: absolute;
    right: 0;
    bottom: -31px;
    padding: 6px 8px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 7px;
    background: rgba(15,23,42,.94);
    color: rgba(255,255,255,.9);
    font: 700 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: nowrap;
    pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
  <main id="selectionSurface" role="dialog" aria-modal="true" aria-labelledby="pickerTitle" aria-describedby="instructions">
    <section id="controls">
      <div id="copy">
        <h1 id="pickerTitle">Choose recording area</h1>
        <p id="instructions">Drag anywhere to redraw. With the selection focused, Arrow keys move it and Shift plus Arrow keys resize it. Press Enter to confirm or Escape to cancel.</p>
        <p id="selectionStatus" role="status" aria-live="polite"></p>
      </div>
      <div id="actions">
        <button type="button" id="cancelBtn" aria-keyshortcuts="Escape">Cancel</button>
        <button type="button" id="confirmBtn" aria-keyshortcuts="Enter">Use area</button>
      </div>
    </section>
    <div id="box" tabindex="0" role="group" aria-describedby="instructions">
      <div id="size" aria-hidden="true"></div>
    </div>
  </main>
<script>
  const MIN_SIZE = 40;
  let dragStart = null;
  let selection = null;
  let settled = false;

  const box = document.getElementById('box');
  const size = document.getElementById('size');
  const status = document.getElementById('selectionStatus');
  const confirmBtn = document.getElementById('confirmBtn');
  const cancelBtn = document.getElementById('cancelBtn');

  function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
  }

  function initialSelection() {
    const w = Math.max(MIN_SIZE, Math.round(window.innerWidth * .7));
    const h = Math.max(MIN_SIZE, Math.round(window.innerHeight * .66));
    return {
      x: Math.round((window.innerWidth - w) / 2),
      y: Math.round((window.innerHeight - h) / 2),
      w,
      h,
    };
  }

  function normalizedRect(rect) {
    const w = clamp(Math.round(rect.w), 0, window.innerWidth);
    const h = clamp(Math.round(rect.h), 0, window.innerHeight);
    return {
      x: clamp(Math.round(rect.x), 0, Math.max(0, window.innerWidth - w)),
      y: clamp(Math.round(rect.y), 0, Math.max(0, window.innerHeight - h)),
      w,
      h,
    };
  }

  function selectionText(rect) {
    return `${rect.w} by ${rect.h} pixels at ${rect.x}, ${rect.y}`;
  }

  function renderSelection(rect, announce = false) {
    selection = normalizedRect(rect);
    const valid = selection.w >= MIN_SIZE && selection.h >= MIN_SIZE;
    box.style.left = `${selection.x}px`;
    box.style.top = `${selection.y}px`;
    box.style.width = `${selection.w}px`;
    box.style.height = `${selection.h}px`;
    size.textContent = `${selection.w} x ${selection.h}`;
    box.setAttribute('aria-label', `Recording area, ${selectionText(selection)}`);
    confirmBtn.disabled = !valid;
    if (announce) {
      status.textContent = valid
        ? `Selected ${selectionText(selection)}.`
        : `Selection must be at least ${MIN_SIZE} by ${MIN_SIZE} pixels.`;
    }
  }

  function rectFromPointer(event) {
    const x1 = Math.min(dragStart.x, event.clientX);
    const y1 = Math.min(dragStart.y, event.clientY);
    const x2 = Math.max(dragStart.x, event.clientX);
    const y2 = Math.max(dragStart.y, event.clientY);
    return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
  }

  function confirmSelection() {
    if (settled || !selection || confirmBtn.disabled) return;
    settled = true;
    window.sf?.areaSelected({
      ...selection,
      viewportW: window.innerWidth,
      viewportH: window.innerHeight,
      xPct: selection.x / window.innerWidth,
      yPct: selection.y / window.innerHeight,
      wPct: selection.w / window.innerWidth,
      hPct: selection.h / window.innerHeight,
    });
  }

  function cancelSelection() {
    if (settled) return;
    settled = true;
    window.sf?.areaCanceled();
  }

  window.addEventListener('mousedown', event => {
    if (event.target.closest('#controls')) return;
    dragStart = { x: event.clientX, y: event.clientY };
    renderSelection({ x: dragStart.x, y: dragStart.y, w: 0, h: 0 });
    box.focus({ preventScroll: true });
  });

  window.addEventListener('mousemove', event => {
    if (!dragStart) return;
    renderSelection(rectFromPointer(event));
  });

  window.addEventListener('mouseup', event => {
    if (!dragStart) return;
    renderSelection(rectFromPointer(event), true);
    dragStart = null;
    box.focus({ preventScroll: true });
  });

  window.addEventListener('keydown', event => {
    const target = event.target instanceof Element ? event.target : null;
    if (event.key === 'Escape') {
      event.preventDefault();
      cancelSelection();
      return;
    }
    if (event.key === 'Enter' && !target?.closest('button')) {
      event.preventDefault();
      confirmSelection();
      return;
    }
    if (target?.closest('button')) return;
    if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(event.key) || !selection) return;
    event.preventDefault();
    const step = event.altKey ? 1 : 10;
    const next = { ...selection };
    if (event.shiftKey) {
      if (event.key === 'ArrowLeft') next.w = Math.max(MIN_SIZE, next.w - step);
      if (event.key === 'ArrowRight') next.w = Math.min(window.innerWidth - next.x, next.w + step);
      if (event.key === 'ArrowUp') next.h = Math.max(MIN_SIZE, next.h - step);
      if (event.key === 'ArrowDown') next.h = Math.min(window.innerHeight - next.y, next.h + step);
    } else {
      if (event.key === 'ArrowLeft') next.x -= step;
      if (event.key === 'ArrowRight') next.x += step;
      if (event.key === 'ArrowUp') next.y -= step;
      if (event.key === 'ArrowDown') next.y += step;
    }
    renderSelection(next, true);
  });

  confirmBtn.addEventListener('click', confirmSelection);
  cancelBtn.addEventListener('click', cancelSelection);
  window.addEventListener('resize', () => renderSelection(selection || initialSelection(), true));

  renderSelection(initialSelection(), true);
  requestAnimationFrame(() => box.focus({ preventScroll: true }));
</script>
</body>
</html>
